name: check
# `nix flake check` runs here only; local development uses incremental CMake builds.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L path:.
